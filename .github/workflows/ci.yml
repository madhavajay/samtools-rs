name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-gate:
    name: Rust gate (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Use local htslib-rs/noodles submodule checkouts for cargo
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch."https://github.com/madhavajay/htslib-rs.git"]
          htslib-rs = { path = "repos/htslib-rs/crates/htslib-rs" }

          [patch."https://github.com/madhavajay/noodles.git"]
          noodles = { path = "repos/htslib-rs/repos/noodles/noodles" }
          EOF

      - name: Cargo fmt --check
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  parity-gate:
    name: Parity gate (samtools test.pl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Use local htslib-rs/noodles submodule checkouts for cargo
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [patch."https://github.com/madhavajay/htslib-rs.git"]
          htslib-rs = { path = "repos/htslib-rs/crates/htslib-rs" }

          [patch."https://github.com/madhavajay/noodles.git"]
          noodles = { path = "repos/htslib-rs/repos/noodles/noodles" }
          EOF

      - name: Install Perl + bgzip
        run: sudo apt-get update && sudo apt-get install -y perl tabix

      - name: Build release binary
        run: cargo build --release -p samtools-rs-cli

      - name: Run passing samtools/test/test.pl subset
        run: python3 scripts/run-passing-parity-subset.py --samtools "$GITHUB_WORKSPACE/target/release/samtools"

      - name: Run passing samtools/test regression.sh subset
        run: python3 scripts/run-passing-regression-subset.py --samtools "$GITHUB_WORKSPACE/target/release/samtools"

      - name: Run samtools/test/test.pl against Rust binary
        run: |
          cp "$GITHUB_WORKSPACE/target/release/samtools" "$GITHUB_WORKSPACE/repos/samtools/samtools"
          cd repos/samtools
          perl test/test.pl
