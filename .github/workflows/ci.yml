name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-gate:
    name: Rust gate (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Cargo fmt --check
        run: cargo fmt --all --check

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --workspace

  parity-gate:
    name: Parity gate (samtools test.pl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Perl + bgzip
        run: sudo apt-get update && sudo apt-get install -y perl tabix

      - name: Build release binary
        run: cargo build --release -p samtools-rs-cli

      - name: Run passing samtools/test/test.pl subset
        run: python3 scripts/run-passing-parity-subset.py --samtools "$GITHUB_WORKSPACE/target/release/samtools"

      - name: Run passing samtools/test regression.sh subset
        run: python3 scripts/run-passing-regression-subset.py --samtools "$GITHUB_WORKSPACE/target/release/samtools"

      - name: Run samtools/test/test.pl against Rust binary
        run: |
          cp "$GITHUB_WORKSPACE/target/release/samtools" "$GITHUB_WORKSPACE/samtools/samtools"
          cd samtools
          perl test/test.pl || true
          # The passing subset above is required. The full harness still covers
          # partial/out-of-scope rows as an advisory regression watch, so its
          # exit code is intentionally not propagated yet.
